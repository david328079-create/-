<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>植人蔬食 POS</title><style>body{font-family:system-ui;margin:16px;background:#f5f7f4;color:#233}button,input,select{font-size:18px;padding:10px;margin:4px;border-radius:8px;border:1px solid #aaa}button{background:#dcebdc}section{background:white;padding:14px;margin:12px 0;border-radius:12px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}small{color:#666}</style><h1>植人蔬食 POS</h1><small>單機測試版：資料只存在這台裝置的瀏覽器內</small><section><h2>點餐</h2><div id="menu"></div></section><section><h2>購物車</h2><div id="cart"></div><h3 id="total"></h3><label>收現金 <input id="cash" type="number" min="0" inputmode="numeric"></label><div id="change"></div><button onclick="checkout()">確認收款</button><button onclick="clearCart()">清空</button></section><section><h2>菜單管理</h2><input id="name" placeholder="品名"><input id="price" type="number" placeholder="價格"><button onclick="addItem()">新增</button><div id="admin"></div></section><section><h2>今日已收款</h2><div id="stats"></div><button onclick="window.print()">列印本頁</button></section><script>
const key='vegpos_menu',orderKey='vegpos_orders';let items=JSON.parse(localStorage.getItem(key)||'null')||[{id:1,name:'麻醬麵',price:60},{id:2,name:'紅燒湯',price:60},{id:3,name:'栗子米糕',price:55}];let cart=[];let orders=JSON.parse(localStorage.getItem(orderKey)||'[]');const $=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(items));function render(){ $('menu').replaceChildren();$('admin').replaceChildren();items.forEach(x=>{let b=document.createElement('button');b.textContent=x.name+' $'+x.price;b.onclick=()=>{let note=prompt('備註（例如：加辣、不加辣）','')||'';cart.push({...x,note});drawCart()};$('menu').append(b);let row=document.createElement('div');row.className='row';let t=document.createElement('span');t.textContent=x.name+' $'+x.price;let edit=document.createElement('button');edit.textContent='修改';edit.onclick=()=>{let n=prompt('品名',x.name),v=prompt('價格',x.price);if(n&&v!==null&&Number(v)>=0&&v.trim()!==''){x.name=n;x.price=Number(v);save();render()}};let del=document.createElement('button');del.textContent='刪除';del.onclick=()=>{if(confirm('確定刪除？')){items=items.filter(y=>y.id!==x.id);save();render()}};row.append(t,edit,del);$('admin').append(row)});drawCart();drawStats()}function drawCart(){$('cart').replaceChildren();cart.forEach((x,i)=>{let d=document.createElement('div');d.textContent=x.name+' $'+x.price+(x.note?'（'+x.note+'）':'');let b=document.createElement('button');b.textContent='移除';b.onclick=()=>{cart.splice(i,1);drawCart()};d.append(b);$('cart').append(d)});let total=cart.reduce((s,x)=>s+x.price,0);$('total').textContent='合計：$'+total;let cash=Number($('cash').value);$('change').textContent=$('cash').value?'找零：$'+(cash-total):''}function addItem(){let n=$('name').value.trim(),p=$('price').value;if(!n||p===''||Number(p)<0)return alert('請輸入正確品名及價格');items.push({id:Date.now(),name:n,price:Number(p)});save();$('name').value='';$('price').value='';render()}function clearCart(){cart=[];$('cash').value='';drawCart()}function checkout(){let total=cart.reduce((s,x)=>s+x.price,0);if(!cart.length)return alert('尚未點餐');if($('cash').value===''||Number($('cash').value)<total)return alert('收款不足');orders.push({date:new Date().toLocaleDateString('en-CA'),total,items:cart});localStorage.setItem(orderKey,JSON.stringify(orders));alert('收款完成，找零 $'+(Number($('cash').value)-total));clearCart();drawStats()}function drawStats(){let today=new Date().toLocaleDateString('en-CA'),a=orders.filter(o=>o.date===today);$('stats').textContent='訂單 '+a.length+' 筆，營業額 $'+a.reduce((s,o)=>s+o.total,0)}$('cash').oninput=drawCart;render();
</script></html>
