<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>植人蔬食 POS V4</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f4f5f1;color:#20251f}
header{position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:1px solid #ddd;z-index:5;display:flex;justify-content:space-between;align-items:center}
h1{font-size:21px;margin:0}.tabs,.cats{display:flex;gap:8px;overflow:auto;padding:10px}.tabs button,.cats button,button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;background:#e5e8e1}
.tabs button.active,.cats button.active,.primary{background:#253b2c;color:white}.page{display:none;padding:12px}.page.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:white;border-radius:15px;padding:12px;box-shadow:0 1px 4px #0001}
.foodimg{height:110px;border-radius:12px;background:#e8ece5;display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden}.foodimg img{width:100%;height:100%;object-fit:cover}
.name{font-weight:700;margin-top:8px}.price{font-size:18px;margin-top:4px}.cart{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:12px;margin:12px -12px -12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}.pill{padding:7px 10px;border-radius:999px;background:#eee}
input,select{font-size:16px;padding:11px;border:1px solid #bbb;border-radius:10px;max-width:100%}.wide{width:100%}.big{font-size:18px;padding:15px;width:100%}
.order{background:#fff;border-radius:14px;padding:12px;margin:10px 0;border-left:5px solid #657568}.muted{color:#687067;font-size:14px}
.admin-item{background:#fff;padding:10px;border-radius:12px;margin:8px 0}.danger{background:#f3dddd}.ok{background:#dce9dc}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.page{max-width:1100px;margin:auto}}

.status{font-size:13px;padding:7px 10px;border-radius:10px;background:#eef1ea;display:inline-block}
.notice{padding:12px;border-radius:12px;background:#fff7dd;margin:10px 0;color:#72501c}
.hidden{display:none!important}.auth{max-width:470px;margin:24px auto}.auth input{margin:5px 0}.mini{font-size:13px}.done{background:#d6edd6}.card[role=button]{cursor:pointer}
.order.new{border-left-color:#d78b17}.order.preparing{border-left-color:#345ab4}.order.completed{border-left-color:#47904c}
button:disabled{opacity:.5;cursor:not-allowed} .admin-input{width:100%;margin-top:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style></head><body>
<header><h1>植人蔬食 POS</h1><span id="clock" class="muted"></span></header>
<div class="tabs"><button id="tab-customer" class="active" onclick="showPage('customer')">客人點餐</button><button id="tab-pos" class="hidden" onclick="showPage('pos')">店家點餐</button><button id="tab-orders" class="hidden" onclick="showPage('orders')">訂單紀錄</button><button id="tab-admin" class="hidden" onclick="showPage('admin')">菜單管理</button><button id="tab-login" onclick="showPage('login')">店主登入</button></div>
<section id="customer" class="page active"><div class="card"><h2 style="margin-top:0">歡迎點餐</h2><div class="row"><select id="customerType" onchange="toggleTable('customer')"><option>內用</option><option>外帶</option></select><select id="customerTable"></select></div><span class="muted mini">送出後將直接送達店家的雲端訂單系統。請勿重複送出。</span></div><div id="customerCats" class="cats"></div><div id="customerMenu" class="grid"></div><div class="cart"><div id="customerCart"></div><div class="row"><b id="customerTotal">合計 $0</b><button class="primary" id="customerSubmit" onclick="submitOrder('customer')">送出訂單</button></div></div></section>
<section id="pos" class="page"><div class="card"><b>用餐方式</b><div class="row"><select id="posType" onchange="toggleTable('pos')"><option>內用</option><option>外帶</option></select><select id="posTable"></select></div></div><div id="posCats" class="cats"></div><div id="posMenu" class="grid"></div><div class="cart"><div id="posCart"></div><div class="row"><b id="posTotal">合計 $0</b><button class="primary" id="posSubmit" onclick="submitOrder('pos')">確認下單</button></div></div></section>
<section id="orders" class="page"><div class="notice">此頁僅登入的店主可查看。訂單每 8 秒自動更新；目前尚未串接出單機。</div><div class="card"><h2>今日營業</h2><div id="summary">讀取中...</div><button onclick="loadOrders()">立即更新訂單</button></div><div id="orderList"></div></section>
<section id="admin" class="page"><div class="card"><h2>新增餐點</h2><select id="aCat"></select><input id="aName" placeholder="品名"><input id="aPrice" type="number" min="0" placeholder="價格"><input id="aImg" class="wide" placeholder="圖片網址（可留白）"><button class="primary" onclick="addItem()">新增餐點</button></div><div class="notice">套餐規則尚未雲端化；V4 暫不提供套餐組合設定。商品停售後客人將不再看到。</div><div class="card"><h2>現有餐點</h2><div id="adminList"></div></div></section>
<section id="login" class="page"><div class="card auth"><h2 id="loginTitle">店主登入</h2><p id="loginStatus" class="muted">請使用 Supabase Authentication 建立的帳號登入。</p><div id="loginForm"><input id="loginEmail" class="wide" type="email" autocomplete="username" placeholder="電子郵件"><input id="loginPassword" class="wide" type="password" autocomplete="current-password" placeholder="密碼"><button id="loginBtn" class="primary big" onclick="login()">登入</button></div><div id="logoutArea" class="hidden"><button onclick="logout()">登出店主帳號</button></div></div></section>
<script>
const URL='https://sdwooaceqheaxfybyymy.supabase.co',KEY='sb_publishable_JWLxP4GofXjKivuwcKEEoA_pct9NUxB';
let token=null,refreshToken=null,expiry=0,admin=false,menu=[],categories=[],carts={pos:[],customer:[]},cats={pos:'主食',customer:'主食'},orders=[],items=[],busy=false,interval=null;
const $=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function errMsg(e){return e?.message||'未知錯誤'}
for(const x of ['pos','customer']){for(let n=1;n<=8;n++)$(x+'Table').add(new Option(n+'號桌',n));toggleTable(x)}
function showPage(id){if(!admin&&['pos','orders','admin'].includes(id))return showPage('login');document.querySelectorAll('.page').forEach(n=>n.classList.toggle('active',n.id===id));document.querySelectorAll('.tabs button').forEach(n=>n.classList.toggle('active',n.id==='tab-'+id));if(id==='orders')loadOrders();if(id==='admin')renderAdmin()}
function toggleTable(x){$(x+'Table').style.display=$(x+'Type').value==='內用'?'':'none'}
async function request(path,{method='GET',body,authenticated=false,prefer}={}){if(authenticated)await ensureToken();const headers={apikey:KEY,'Authorization':'Bearer '+(authenticated?token:KEY)};if(body!==undefined)headers['Content-Type']='application/json';if(prefer)headers.Prefer=prefer;let resp=await fetch(URL+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});let data=await resp.text();let out;try{out=data?JSON.parse(data):null}catch{out=data}if(!resp.ok)throw Error(typeof out==='object'?(out?.message||out?.error_description||out?.error||'請求失敗'):data);return out}
function storeAuth(a){token=a.access_token;refreshToken=a.refresh_token;expiry=Math.floor(Date.now()/1000)+(a.expires_in||3600);sessionStorage.setItem('zhiren_v4_session',JSON.stringify({token,refreshToken,expiry}))}
async function ensureToken(){if(!token)throw Error('請先登入店主帳號');if(Date.now()/1000<expiry-90)return;let r=await fetch(URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refreshToken})});let a=await r.json();if(!r.ok){clearAuth();throw Error('登入已逾時，請重新登入')}storeAuth(a)}
function clearAuth(){token=null;refreshToken=null;expiry=0;admin=false;sessionStorage.removeItem('zhiren_v4_session');setAdmin(false)}
function setAdmin(val){admin=val;['pos','orders','admin'].forEach(k=> $('tab-'+k).classList.toggle('hidden',!val));$('tab-login').textContent=val?'店主帳號':'店主登入';$('loginForm').classList.toggle('hidden',val);$('logoutArea').classList.toggle('hidden',!val);$('loginTitle').textContent=val?'店主已登入':'店主登入';$('loginStatus').textContent=val?'已啟用店家點餐、訂單及菜單管理。':'請使用 Supabase Authentication 建立的帳號登入。';if(val){if(!interval)interval=setInterval(()=>{if(document.visibilityState==='visible')loadOrders(true)},8000)}else if(interval){clearInterval(interval);interval=null}}
async function verifyAdmin(){try{let yes=await request('/rest/v1/rpc/is_pos_admin',{method:'POST',body:{},authenticated:true});if(yes!==true)throw Error('此登入帳號尚未授權為店主');setAdmin(true);await loadMenu();await loadOrders(true);return true}catch(e){clearAuth();throw e}}
async function login(){let email=$('loginEmail').value.trim(),password=$('loginPassword').value;if(!email||!password)return alert('請輸入電子郵件與密碼');$('loginBtn').disabled=true;try{let r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});let a=await r.json();if(!r.ok)throw Error(a.msg||a.error_description||a.message||'帳號密碼錯誤');storeAuth(a);await verifyAdmin();$('loginPassword').value='';showPage('orders');alert('店主登入成功')}catch(e){alert('登入失敗：'+errMsg(e))}finally{$('loginBtn').disabled=false}}
async function logout(){try{if(token)await request('/auth/v1/logout',{method:'POST',authenticated:true})}catch(e){}clearAuth();showPage('customer');await loadMenu()}
async function loadMenu(){try{let isAdmin=admin;let [cs,ms]=await Promise.all([request('/rest/v1/categories?select=id,name,sort_order,active&order=sort_order.asc',{authenticated:isAdmin}),request('/rest/v1/menu_items?select=id,category_id,name,price,image_url,active,sort_order&order=sort_order.asc',{authenticated:isAdmin})]);categories=cs;let cm=Object.fromEntries(cs.map(c=>[c.id,c.name]));menu=ms.map(m=>({...m,cat:cm[m.category_id]||'其他'}));for(const x of ['customer','pos'])renderMenu(x);renderAdmin()}catch(e){for(const x of ['customer','pos'])$(x+'Menu').textContent='雲端菜單讀取失敗：'+errMsg(e)}}
function renderMenu(x){let cs=categories.filter(c=>c.active).map(c=>c.name);if(!cs.includes(cats[x]))cats[x]=cs[0]||'主食';let place=$(x+'Cats');place.replaceChildren();cs.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className=cats[x]===c?'active':'';b.onclick=()=>{cats[x]=c;renderMenu(x)};place.append(b)});let m=$(x+'Menu');m.replaceChildren();menu.filter(i=>i.cat===cats[x]&&i.active).forEach(i=>{let card=document.createElement('div');card.className='card';card.setAttribute('role','button');let pic=document.createElement('div');pic.className='foodimg';if(x==='customer'&&i.image_url&&/^https:\/\//i.test(i.image_url)){let img=document.createElement('img');img.src=i.image_url;img.alt=i.name;img.onerror=()=>pic.textContent='🍜';pic.append(img)}else pic.textContent=x==='customer'?'🍜':'餐點';let name=document.createElement('div');name.className='name';name.textContent=i.name;let price=document.createElement('div');price.className='price';price.textContent='$'+i.price;card.append(pic,name,price);card.onclick=()=>{let note=prompt('備註（可留白，例如：加辣／不辣）','');if(note===null)return;if(note.length>150)return alert('備註最多 150 個字');let row=carts[x].find(r=>r.menu_item_id===i.id&&r.note===note);if(row&&row.quantity<20)row.quantity++;else carts[x].push({menu_item_id:i.id,name:i.name,price:i.price,quantity:1,note});renderCart(x)};m.append(card)})}
function renderCart(x){let area=$(x+'Cart');area.replaceChildren();carts[x].forEach((r,j)=>{let div=document.createElement('div');div.className='row';let label=document.createElement('span');label.textContent=r.name+' ×'+r.quantity+(r.note?'・'+r.note:'');let side=document.createElement('span');side.textContent='$'+r.price*r.quantity+' ';let del=document.createElement('button');del.textContent='×';del.onclick=()=>{carts[x].splice(j,1);renderCart(x)};side.append(del);div.append(label,side);area.append(div)});$(x+'Total').textContent='合計 $'+carts[x].reduce((sum,r)=>sum+r.price*r.quantity,0)}
async function submitOrder(x){if(busy)return;if(x==='pos'&&!admin)return alert('請先登入店主帳號');if(!carts[x].length)return alert('尚未點餐');let type=$(x+'Type').value,table=type==='內用'?Number($(x+'Table').value):null,payload={p_source:x==='pos'?'pos':'qr',p_dining_type:type==='內用'?'dine_in':'takeout',p_table_no:table,p_items:carts[x].map(r=>({menu_item_id:r.menu_item_id,quantity:r.quantity,note:r.note}))};if(!confirm('確認送出這筆雲端訂單？'))return;busy=true;$(x+'Submit').disabled=true;try{let v=await request('/rest/v1/rpc/submit_order',{method:'POST',body:payload,authenticated:x==='pos'});carts[x]=[];renderCart(x);alert('雲端下單成功！\n單號：'+v.order_no+'\n金額：$'+v.total+'\n請勿重複下單。');if(admin)loadOrders(true)}catch(e){alert('訂單未確認成功，請先向店家確認，避免重複下單。\n'+errMsg(e))}finally{busy=false;$(x+'Submit').disabled=false}}
async function loadOrders(silent=false){if(!admin)return;try{let a=await request('/rest/v1/orders?select=id,order_no,source,dining_type,table_no,total,status,payment_status,created_at&order=created_at.desc&limit=150',{authenticated:true});let ids=a.map(o=>o.id);let lines=ids.length?await request('/rest/v1/order_items?select=order_id,item_name,quantity,unit_price,note&order=id.asc&limit=500',{authenticated:true}):[];orders=a;items=lines;renderOrders()}catch(e){if(!silent)$('summary').textContent='訂單讀取失敗：'+errMsg(e);else console.warn(e)}}
function renderOrders(){let today=new Date().toLocaleDateString('en-CA');let todayOrders=orders.filter(o=>new Date(o.created_at).toLocaleDateString('en-CA')===today&&o.status!=='cancelled');let paid=todayOrders.filter(o=>o.payment_status==='paid');$('summary').innerHTML=`今日訂單 <b>${todayOrders.length}</b> 筆　已收款 <b>$${paid.reduce((s,o)=>s+o.total,0)}</b>　未收款 <b>$${todayOrders.filter(o=>o.payment_status==='unpaid').reduce((s,o)=>s+o.total,0)}</b><div class="muted mini">依訂單時間與付款狀態統計；測試單請取消並標記為未收款。</div>`;let l=$('orderList');l.replaceChildren();orders.forEach(o=>{let card=document.createElement('div');card.className='order '+o.status;let title=document.createElement('div');title.className='row';let name=document.createElement('b');name.textContent=o.order_no+'｜'+(o.dining_type==='dine_in'?o.table_no+'號桌':'外帶');let state=document.createElement('span');state.className='pill';state.textContent=o.source.toUpperCase()+'・'+({'new':'新訂單','preparing':'製作中','completed':'完成','cancelled':'取消'}[o.status]||o.status);title.append(name,state);let detail=document.createElement('div');detail.textContent=items.filter(i=>i.order_id===o.id).map(i=>i.item_name+' ×'+i.quantity+(i.note?'（'+i.note+'）':'')).join('、');let tail=document.createElement('div');tail.className='row muted';tail.textContent=new Date(o.created_at).toLocaleString()+'　NT$'+o.total+'　'+(o.payment_status==='paid'?'已收款':'未收款');let actions=document.createElement('div');actions.className='toolbar';[['new','新訂單'],['preparing','製作中'],['completed','完成'],['cancelled','取消']].forEach(([v,label])=>{let b=document.createElement('button');b.textContent=label;b.disabled=o.status===v;b.onclick=()=>updateOrder(o.id,{status:v});actions.append(b)});let pay=document.createElement('button');pay.textContent=o.payment_status==='paid'?'改為未收款':'標記已收款';pay.onclick=()=>updateOrder(o.id,{payment_status:o.payment_status==='paid'?'unpaid':'paid'});actions.append(pay);card.append(title,detail,tail,actions);l.append(card)})}
async function updateOrder(id,changes){if(!admin)return;if(changes.status==='cancelled'&&!confirm('確定取消此訂單？'))return;try{await request('/rest/v1/orders?id=eq.'+id,{method:'PATCH',body:changes,authenticated:true,prefer:'return=minimal'});await loadOrders(true)}catch(e){alert('更新失敗：'+errMsg(e))}}
function renderAdmin(){if(!admin)return;let sel=$('aCat');sel.replaceChildren();categories.filter(c=>c.active).forEach(c=>sel.add(new Option(c.name,c.id)));let list=$('adminList');list.replaceChildren();menu.forEach(i=>{let div=document.createElement('div');div.className='admin-item';let label=document.createElement('b');label.textContent=i.cat+'｜'+i.name+' $'+i.price+(i.active?'':'（停售）');let actions=document.createElement('div');let edit=document.createElement('button');edit.textContent='修改';edit.onclick=()=>editItem(i);let toggle=document.createElement('button');toggle.textContent=i.active?'暫停販售':'恢復販售';toggle.onclick=()=>changeItem(i,{active:!i.active});let remove=document.createElement('button');remove.textContent='刪除';remove.className='danger';remove.onclick=()=>deleteItem(i);actions.append(edit,toggle,remove);div.append(label,actions);list.append(div)})}
async function addItem(){if(!admin)return;let n=$('aName').value.trim(),p=Number($('aPrice').value),img=$('aImg').value.trim(),cat=Number($('aCat').value);if(!n||!Number.isInteger(p)||p<0||$('aPrice').value==='')return alert('請輸入正確品名和價格');if(img&&!/^https:\/\//i.test(img))return alert('圖片請使用 https:// 網址');try{await request('/rest/v1/menu_items',{method:'POST',body:{name:n,price:p,category_id:cat,image_url:img||null},authenticated:true,prefer:'return=minimal'});$('aName').value=$('aPrice').value=$('aImg').value='';await loadMenu();alert('新增成功')}catch(e){alert('新增失敗：'+errMsg(e))}}
async function changeItem(i,changes){try{await request('/rest/v1/menu_items?id=eq.'+i.id,{method:'PATCH',body:changes,authenticated:true,prefer:'return=minimal'});await loadMenu()}catch(e){alert('修改失敗：'+errMsg(e))}}
function editItem(i){let name=prompt('品名',i.name);if(name===null)return;name=name.trim();if(!name)return alert('品名不能空白');let s=prompt('價格',i.price);if(s===null)return;let p=Number(s);if(s.trim()===''||!Number.isInteger(p)||p<0)return alert('價格必須為非負整數');changeItem(i,{name,price:p})}
async function deleteItem(i){if(!confirm('確定刪除「'+i.name+'」？舊訂單明細會保留原品名。'))return;try{await request('/rest/v1/menu_items?id=eq.'+i.id,{method:'DELETE',authenticated:true,prefer:'return=minimal'});await loadMenu()}catch(e){alert('刪除失敗：'+errMsg(e))}}
setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),1000);
(async()=>{try{let s=JSON.parse(sessionStorage.getItem('zhiren_v4_session')||'null');if(s?.token){token=s.token;refreshToken=s.refreshToken;expiry=s.expiry;await verifyAdmin()}}catch(e){console.warn(e)}await loadMenu();renderCart('pos');renderCart('customer')})();
</script></body></html>
